<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="EchoCanvas Multi-Modal Visual Narrative and AIGC Orchestration Platform">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1E" />
      <stop offset="48%" stop-color="#1A1642" />
      <stop offset="100%" stop-color="#271C5C" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="82%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <linearGradient id="frameFill1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#312E81" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="frameFill2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="frameFill3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.88" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base & Ambient Lighting -->
  <rect width="1200" height="320" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="18" fill="url(#grid)" />
  <rect width="1200" height="320" rx="18" fill="url(#glowLeft)" />
  <rect width="1200" height="320" rx="18" fill="url(#glowRight)" />
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" />

  <!-- Left Content Area -->
  <g transform="translate(64, 62)">
    <rect x="0" y="0" width="92" height="26" rx="13" fill="#A78BFA" fill-opacity="0.16" stroke="#A78BFA" stroke-opacity="0.45" />
    <text x="46" y="17" text-anchor="middle" fill="#DDD6FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">浮生绘卷</text>

    <text x="0" y="78" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">EchoCanvas</text>
    <rect x="2" y="94" width="160" height="4" rx="2" fill="url(#accentBar)" />

    <text x="0" y="130" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">Multi-Modal Visual Narrative &amp; AIGC Orchestration Platform</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="154" height="34" rx="17" fill="#0F172A" fill-opacity="0.72" stroke="#38BDF8" stroke-opacity="0.5" />
      <circle cx="18" cy="17" r="4" fill="#38BDF8" />
      <text x="32" y="21" fill="#E0F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Go AIGC Gateway</text>

      <rect x="168" y="0" width="198" height="34" rx="17" fill="#0F172A" fill-opacity="0.72" stroke="#A78BFA" stroke-opacity="0.5" />
      <circle cx="186" cy="17" r="4" fill="#A78BFA" />
      <text x="200" y="21" fill="#EDE9FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Python LangGraph Sidecar</text>

      <rect x="380" y="0" width="214" height="34" rx="17" fill="#0F172A" fill-opacity="0.72" stroke="#F472B6" stroke-opacity="0.5" />
      <circle cx="398" cy="17" r="4" fill="#F472B6" />
      <text x="412" y="21" fill="#FCE7F3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Layered Consistency Memory</text>
    </g>
  </g>

  <!-- Right Storyboard Metaphor Graphic -->
  <g transform="translate(730, 44)">
    <!-- Connector Flow Line -->
    <path d="M 75 110 C 125 65, 165 155, 220 120 C 275 85, 315 160, 365 125" fill="none" stroke="url(#accentBar)" stroke-width="2.5" stroke-dasharray="6 5" stroke-opacity="0.75" />

    <!-- Frame 01 -->
    <g transform="translate(10, 26)">
      <rect x="0" y="0" width="144" height="106" rx="10" fill="url(#frameFill1)" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.5" />
      <rect x="12" y="12" width="120" height="58" rx="6" fill="#0F172A" fill-opacity="0.55" />
      <circle cx="96" cy="34" r="10" fill="#A78BFA" fill-opacity="0.75" />
      <path d="M 16 68 L 52 44 L 82 62 L 106 50 L 128 68 Z" fill="#38BDF8" fill-opacity="0.35" />
      <rect x="12" y="80" width="64" height="6" rx="3" fill="#E2E8F0" fill-opacity="0.7" />
      <rect x="12" y="91" width="96" height="4" rx="2" fill="#94A3B8" fill-opacity="0.45" />
      <text x="112" y="86" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700">#01</text>
    </g>

    <!-- Frame 02 -->
    <g transform="translate(132, 84)">
      <rect x="0" y="0" width="152" height="112" rx="10" fill="url(#frameFill2)" stroke="#A78BFA" stroke-opacity="0.7" stroke-width="1.5" />
      <rect x="12" y="12" width="128" height="62" rx="6" fill="#0F172A" fill-opacity="0.55" />
      <circle cx="52" cy="38" r="11" fill="#F472B6" fill-opacity="0.72" />
      <path d="M 18 72 L 46 52 L 84 68 L 112 46 L 136 72 Z" fill="#A78BFA" fill-opacity="0.38" />
      <rect x="12" y="84" width="76" height="6" rx="3" fill="#F1F5F9" fill-opacity="0.78" />
      <rect x="12" y="95" width="108" height="4" rx="2" fill="#CBD5E1" fill-opacity="0.48" />
      <text x="118" y="90" fill="#C4B5FD" font-family="monospace" font-size="10" font-weight="700">#02</text>
    </g>

    <!-- Frame 03 -->
    <g transform="translate(262, 36)">
      <rect x="0" y="0" width="144" height="106" rx="10" fill="url(#frameFill3)" stroke="#F472B6" stroke-opacity="0.6" stroke-width="1.5" />
      <rect x="12" y="12" width="120" height="58" rx="6" fill="#0F172A" fill-opacity="0.55" />
      <circle cx="72" cy="36" r="12" fill="#38BDF8" fill-opacity="0.7" />
      <path d="M 16 68 L 48 48 L 88 64 L 128 42 L 128 68 Z" fill="#F472B6" fill-opacity="0.32" />
      <rect x="12" y="80" width="68" height="6" rx="3" fill="#E2E8F0" fill-opacity="0.7" />
      <rect x="12" y="91" width="92" height="4" rx="2" fill="#94A3B8" fill-opacity="0.45" />
      <text x="112" y="86" fill="#F9A8D4" font-family="monospace" font-size="10" font-weight="700">#03</text>
    </g>

    <!-- Gate & State Nodes -->
    <circle cx="75" cy="110" r="5" fill="#38BDF8" />
    <circle cx="220" cy="120" r="5" fill="#A78BFA" />
    <circle cx="365" cy="125" r="5" fill="#F472B6" />
  </g>
</svg>
