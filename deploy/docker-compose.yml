services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: echocanvas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echocanvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_pg_password}
      POSTGRES_DB: ${POSTGRES_DB:-echocanvas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-echocanvas} -d ${POSTGRES_DB:-echocanvas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - echocanvas-net

  redis:
    image: redis:7-alpine
    container_name: echocanvas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - echocanvas-net

  rustfs:
    image: rustfs/rustfs:latest
    container_name: echocanvas-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin_changeme}
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - echocanvas-net

  s3-init:
    image: amazon/aws-cli:latest
    container_name: echocanvas-s3-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-rustfsadmin_changeme}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-echocanvas-media}
    entrypoint:
      - /bin/sh
      - -c
      - |
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null ||
        aws --endpoint-url http://rustfs:9000 s3 mb "s3://$$S3_BUCKET"
    restart: "no"
    networks:
      - echocanvas-net

volumes:
  postgres_data:
  redis_data:
  rustfs_data:

networks:
  echocanvas-net:
    driver: bridge
